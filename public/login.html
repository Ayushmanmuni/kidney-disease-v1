<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — CKD Prediction System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">

    <!-- NAV -->
    <nav id="navbar">
        <div class="nav-content">
            <a href="/" class="logo"><span class="logo-icon">🩺</span><span>CKD Predict</span></a>
            <button id="mobile-menu-toggle" class="mobile-menu-toggle" aria-label="Open navigation menu" aria-controls="mobile-menu-panel" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/about-ckd" class="nav-link">About CKD</a>
                <a href="/how-it-works" class="nav-link">How It Works</a>
                <button id="theme-toggle" aria-label="Toggle dark mode">
                    <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5" />
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                    </svg>
                    <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <div id="mobile-menu-overlay" class="mobile-menu-overlay" aria-hidden="true"></div>
    <aside id="mobile-menu-panel" class="mobile-menu-panel" aria-hidden="true">
        <a href="/" class="mobile-menu-link">Home</a>
        <a href="/dashboard" class="mobile-menu-link">Dashboard</a>
        <a href="/about-ckd" class="mobile-menu-link">About CKD</a>
        <a href="/how-it-works" class="mobile-menu-link">How It Works</a>
        <a href="/signup" class="mobile-menu-link mobile-menu-link-cta">Create Account</a>
    </aside>

    <!-- AUTH SECTION -->
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Log in to access your dashboard and prediction history.</p>
            </div>
            
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="doctor@clinic.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <div id="auth-alert" class="alert hidden"></div>
                
                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="/signup">Create one here</a></p>
            </div>
        </div>
    </main>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/ui-enhancements.js"></script>
    <script>
        // Specific login logic
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('auth-alert');
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (res.ok && data.success) {
                    window.location.href = '/dashboard';
                } else {
                    alertBox.textContent = data.error || 'Login failed.';
                    alertBox.className = 'alert alert-error';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.textContent = 'Server connection error.';
                alertBox.className = 'alert alert-error';
                alertBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
